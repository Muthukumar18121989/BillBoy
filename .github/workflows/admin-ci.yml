name: Admin Console CI

on:
  push:
    branches: [main, feature/production-hardening]
    paths:
      - 'billboy-admin/**'
  pull_request:
    branches: [main]
    paths:
      - 'billboy-admin/**'

jobs:
  typecheck-and-lint:
    name: TypeCheck & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: billboy-admin

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: billboy-admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Use placeholder values so build succeeds in CI without real secrets
          FIREBASE_PROJECT_ID: billboy-1ff2c
          FIREBASE_CLIENT_EMAIL: ci@example.com
          FIREBASE_PRIVATE_KEY: '{"dummy": true}'
          NEXT_PUBLIC_FIREBASE_API_KEY: placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: billboy-1ff2c.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: billboy-1ff2c
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: billboy-1ff2c.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '851190240105'
          NEXT_PUBLIC_FIREBASE_APP_ID: placeholder
          NEXTAUTH_SECRET: ci-secret-not-real
          NEXTAUTH_URL: http://localhost:3000
